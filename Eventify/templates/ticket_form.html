{% load static %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventify - Tickets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="{% static 'css/create_form.css' %}">
    <link rel="icon" href="{% static 'images/eventify-logo.png' %}">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-sm-4 border px-3 py-3 bg-light mb-3">
                <form action="{% url 'get_ticket' event.id %}" method="post" enctype="multipart/form-data">
                    <h2 class="app-name me-auto ms-auto">
                        <img src="{% static 'images/eventify-logo.png' %}" alt="logo" class="img-fluid">
                    </h2>
                    <h5 class="form-name mb-3 text-center">
                        Event Registration
                    </h5>
                    {% csrf_token %}
                    {{ form | crispy }}
                    <button class="save-btn w-100 p-2">Get Ticket</button>
                </form>
            </div>
       </div>
    </div>
</body>
</html>
