{% extends 'master.html' %}
{% load static %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}

{% block title %}
	 <title>Eventify - Add Event</title>
{% endblock %}

{% block extra_css%}
    <link rel="stylesheet" href="{% static 'css/create_form.css'%}">
{% endblock %}

{% block content %}
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-sm-4 border px-3 py-3 bg-light mb-3">
                <form action="{% url 'create_event' %}" method="post" enctype="multipart/form-data">
                    <h2 class="app-name me-auto ms-auto">
                        <img src="{% static 'images/eventify-logo.png' %}" alt="logo" class="img-fluid">
                    </h2>
                    <h5 class="form-name mb-3 mt-3 text-center">
                        Create Event
                    </h5>
                    {% csrf_token %}
                    {{ form | crispy }}
                    <button class="save-btn w-100 p-2">Save Event</button>
                </form>
            </div>
       </div>
    </div>
{% endblock%}
