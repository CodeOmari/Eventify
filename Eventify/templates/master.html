{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="icon" href="{% static 'images/eventify-logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/master.css' %}">
    

    {% block title%}
        <title>Eventify</title>
    {% endblock %}

    {% block extra_css%}
    {% endblock %}
</head>
<body>
     <nav class="navbar navbar-expand-sm navbar-light bg-light sticky-top navigation-section">
      <div class="container">
        <a class="navbar-brand text-primary" href="{% url 'events' %}">
            <img src="{% static 'images/eventify-logo.png' %}" alt="logo" class="img-fluid app-logo">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasNavbar" aria-controls="offcanvasNavbar">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="offcanvas offcanvas-start navigation-menu" tabindex="-1" id="offcanvasNavbar" aria-labelledby="offcanvasNavbarLabel">
          <div class="offcanvas-header">
              <h5 class="offcanvas-title" id="offcanvasNavbarLabel">Eventify</h5>
              <button type="button" class="btn-close btn-close-light" data-bs-dismiss="offcanvas" aria-label="Close"></button>
          </div>
          <div class="offcanvas-body">
              <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                  <a class="nav-link rounded-pill p-2" href="{% url 'events' %}">Discover</a>
                </li>
                <li class="nav-item">
                  <a class="nav-link rounded-pill p-2" href="#">Dashboard</a>
                </li>
                <li class="nav-item create-event ms-2">
                  <a class="d-flex justify-content-center align-items-center p-2" href="{% url 'create_event' %}">Create Event</a>
                </li>
              </ul>
          </div>
        </div>
      </div>
    </nav>

    {% block content %}
    {% endblock %}

</body>
</html>
